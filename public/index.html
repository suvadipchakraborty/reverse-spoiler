<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <header>
    <p class="kicker">The Anti-Watchlist</p>
    <h1>The Reverse<br>Spoiler</h1>
  </header>

  <form id="form" autocomplete="off">
    <label for="q">What movie are you about to waste time on?</label>
    <input id="q" type="search" placeholder="Type a title…" required enterkeyhint="search">
    <button type="submit">Judge it</button>
  </form>

  <p id="tally" class="tally" hidden></p>

  <section id="result" aria-live="polite"></section>

  <div class="actions">
    <button id="install" class="ghost" type="button">Save app to home screen</button>
  </div>
</main>
